# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.0.4"

package:
  name: mockito
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mockito/mockito-${{ version }}.tar.gz
  sha256: d341f228c5b5ccf3c473751f6c6f09d8d83c5da49846a6ee31eb60b65607e0ef

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
  run:
    - python >==${{ python_min }}

tests:
  - python:
      imports: mockito
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest-cov
        - numpy
    script:
      - coverage run --source=mockito --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=100

about:
  summary: Spying framework
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/mockito
  repository: https://github.com/kaste/mockito-python
  documentation: https://mockito-python.readthedocs.io

extra:
  recipe-maintainers:
    - vnlitvinov
    - bollwyvl
